app-id: io.github.nasimhuq.prtsc_timer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: prtsc_timer
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: prtsc_timer
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3/site-packages /app/bin
      - cp -r src/prtsc_timer /app/lib/python3/site-packages/
      - |
        cat > /app/bin/prtsc_timer <<'EOF'
        #!/usr/bin/env python3
        import sys
        sys.path.insert(0, "/app/lib/python3/site-packages")
        from prtsc_timer.app import main
        sys.exit(main())
        EOF
      - chmod +x /app/bin/prtsc_timer
      - install -Dm644 data/io.github.nasimhuq.prtsc_timer.desktop /app/share/applications/io.github.nasimhuq.prtsc_timer.desktop
      - install -Dm644 data/io.github.nasimhuq.prtsc_timer.metainfo.xml /app/share/metainfo/io.github.nasimhuq.prtsc_timer.metainfo.xml
      - install -Dm644 data/io.github.nasimhuq.prtsc_timer.svg /app/share/icons/hicolor/scalable/apps/io.github.nasimhuq.prtsc_timer.svg
    sources:
      - type: dir
        path: .
